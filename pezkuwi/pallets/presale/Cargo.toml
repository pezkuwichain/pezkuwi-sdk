[package]
name = "pallet-presale"
version = "1.0.0"
description = "PEZ token presale pallet - accepts wUSDT, distributes PEZ"
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { default-features = false, features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], workspace = true }
log = { version = "0.4.14", default-features = false }

frame-support = { default-features = false, workspace = true }
frame-system = { default-features = false, workspace = true }
frame-benchmarking = { default-features = false, optional = true, workspace = true }
sp-runtime = { default-features = false, workspace = true }
sp-std = { default-features = false, workspace = true }

pallet-assets = { default-features = false, workspace = true }
pallet-balances = { default-features = false, workspace = true, optional = true }

[dev-dependencies]
sp-core = { workspace = true }
sp-io = { workspace = true }
pallet-balances = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "log/std",
    "frame-support/std",
    "frame-system/std",
    "sp-std/std",
    "sp-runtime/std",
    "pallet-assets/std",
    "pallet-balances?/std",
    "sp-core/std",
    "sp-io/std",
    "frame-benchmarking?/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-assets/runtime-benchmarks",
    "pallet-balances",
    "log/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
