[package]
name = "pezkuwi-zombienet-sdk-tests"
version = "0.1.0"
description = "Zomebienet-sdk tests."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
asset-hub-zagros-runtime = { workspace = true }
codec = { workspace = true, features = ["derive"] }
cumulus-zombienet-sdk-helpers = { workspace = true }
env_logger = { workspace = true }
ethabi = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
pallet-revive = { workspace = true, features = ["std"] }
pezkuwi-primitives = { workspace = true, default-features = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sp-core = { workspace = true }
subxt = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true, features = ["time"] }
zombienet-orchestrator = { workspace = true }
zombienet-sdk = { workspace = true }

[features]
zombie-metadata = []
zombie-ci = []
runtime-benchmarks = [
	"asset-hub-zagros-runtime/runtime-benchmarks",
	"cumulus-zombienet-sdk-helpers/runtime-benchmarks",
	"pallet-revive/runtime-benchmarks",
	"pezkuwi-primitives/runtime-benchmarks",
	"sc-executor/runtime-benchmarks"
]

[build-dependencies]
sc-executor = { workspace = true, default-features = true }
sc-runtime-utilities = { workspace = true, default-features = true }
sp-io = { workspace = true }
substrate-build-script-utils = { workspace = true, default-features = true }
