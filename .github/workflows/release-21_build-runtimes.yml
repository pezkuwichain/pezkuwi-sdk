name: Release - Build runtimes

on:
  workflow_dispatch:
    inputs:
      chain:
        description: The chain to use
        default: all
        required: true
        type: choice
        options:
          - all
          - zagros
          - asset-hub-zagros
          - bridge-hub-zagros
          - collectives-zagros
          - coretime-zagros
          - glutton-zagros
          - people-zagros
      runtime_dir:
        description: The runtime dir to be used (⚠️ this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        default: polkadot/runtime/zagros
        type: choice
        options:
          - polkadot/runtime/zagros
          - cumulus/teyrchains/runtimes/assets/asset-hub-zagros
          - cumulus/teyrchains/runtimes/bridge-hubs/bridge-hub-zagros
          - cumulus/teyrchains/runtimes/collectives/collectives-zagros
          - cumulus/teyrchains/runtimes/coretime/coretime-zagros
          - cumulus/teyrchains/runtimes/people/people-zagros
          - cumulus/teyrchains/runtimes/glutton/glutton-zagros

      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcY or polkadot-stableYYMM(-X)
        type: string

  workflow_call:
    inputs:
      chain:
        description: The chain to use
        default: all
        required: true
        type: string
      runtime_dir:
        description: The runtime dir to be used (⚠️ this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        default: polkadot/runtime/zagros
        type: string
      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcY or polkadot-stableYYMM(-X)
        type: string
    outputs:
      published_runtimes:
        value: ${{ jobs.build-runtimes.outputs.published_runtimes }}

jobs:
  check-synchronization:
    # DISABLED: uses: paritytech-release/sync-workflows/.github/workflows/check-synchronization.yml@main
    secrets:
      fork_writer_app_key: ${{ secrets.UPSTREAM_CONTENT_SYNC_APP_KEY }}

  validate-inputs:
    needs: [check-synchronization]
    if: ${{ needs.check-synchronization.outputs.checks_passed }} == 'true'
    runs-on: ubuntu-latest
    outputs:
        release_tag: ${{ steps.validate_inputs.outputs.release_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Validate inputs
        id: validate_inputs
        run: |
          . ./.github/scripts/common/lib.sh

          RELEASE_TAG=$(validate_stable_tag ${{ inputs.release_tag }})
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

  build-runtimes:
    needs: [validate-inputs]
    uses: "./.github/workflows/release-srtool.yml"
    with:
       excluded_runtimes: "asset-hub-pezkuwichain bridge-hub-pezkuwichain coretime-pezkuwichain people-pezkuwichain pezkuwichain pezkuwichain-teyrchain substrate-test bp cumulus-test kitchensink minimal-template teyrchain-template penpal polkadot-test seedling shell frame-try sp solochain-template polkadot-sdk-docs-first pallet-staking-async-teyrchain pallet-staking-async-rc frame-storage-access-test yet-another-teyrchain revive-dev"
       build_opts: "--features on-chain-release-build"
       profile: production
       chain: ${{ inputs.chain }}
       runtime_dir: ${{ inputs.runtime_dir }}
    permissions:
      id-token: write
      attestations: write
      contents: read
