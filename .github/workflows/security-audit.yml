name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Run weekly on Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isdraft:
    # Skip draft PRs but always run on schedule/push
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft"

  cargo-deny:
    needs: isdraft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - licenses
          - bans
          - sources
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  # The tools under tools/ declare their own [workspace], so the run above never
  # reaches their dependency graphs. Same policy file, so the ignore list stays
  # single-sourced in deny.toml.
  cargo-deny-tools:
    needs: isdraft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manifest: [tools/usdt-bridge/Cargo.toml, tools/chain-spec-tool/Cargo.toml]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories
          # The action runs cargo-deny in a container with the checkout mounted at
          # /github/workspace, so the policy is named by that path.
          arguments: --config /github/workspace/deny.toml

  # cargo-deny reads RustSec only, and has been silent on advisories it did have
  # in its database. This audits every resolved crate against OSV (GHSA and
  # RustSec together) and compares with the recorded baseline in
  # .github/scripts/osv-baseline.json, which can only shrink: a new advisory and
  # a stale entry both fail. Same policy as pezkuwi-DKS, so the two repositories
  # give the same verdict on the same tree.
  osv:
    needs: isdraft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Every resolved crate, against GHSA and RustSec together
        run: python3 .github/scripts/check-osv-advisories.py --verbose

  confirm-security-audit-passed:
    runs-on: ubuntu-latest
    name: Security audit summary
    needs: [cargo-deny, cargo-deny-tools, osv]
    if: always() && !cancelled()
    steps:
      - run: |
          tee resultfile <<< '${{ toJSON(needs) }}'
          FAILURES=$(cat resultfile | grep '"result": "failure"' | wc -l)
          if [ $FAILURES -gt 0 ]; then
            echo "### Security audit FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Review the cargo-deny and osv job outputs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '### All security audits passed' >> $GITHUB_STEP_SUMMARY
          fi
