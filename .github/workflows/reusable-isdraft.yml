# The workflow is not part of reusable-preflight.yml to allow testing CI in draft.

name: Preflight isdraft

on:
  workflow_call:
    # Map the workflow outputs to job outputs

jobs:
  isdraft:
    runs-on: ubuntu-latest
    # Always run - draft check logic moved to step level for better debugging
    steps:
      - name: Check if CI should run
        shell: bash
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "PR draft status: ${{ github.event.pull_request.draft }}"
          echo "PR labels: ${{ join(github.event.pull_request.labels.*.name, ', ') }}"

          # For non-PR events (push, workflow_dispatch), always allow
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "✅ CI allowed - not a pull_request event"
            exit 0
          fi

          # For PRs: check if draft without override label
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            if [[ "${{ join(github.event.pull_request.labels.*.name, ',') }}" == *"A5-run-CI"* ]]; then
              echo "✅ CI allowed - draft PR with A5-run-CI label"
              exit 0
            else
              echo "❌ CI blocked - draft PR without A5-run-CI label"
              exit 1
            fi
          fi

          echo "✅ CI allowed - not a draft PR"
          exit 0
