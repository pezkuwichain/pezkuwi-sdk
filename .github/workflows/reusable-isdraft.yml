# The workflow is not part of reusable-preflight.yml to allow testing CI in draft.

name: Preflight isdraft

on:
  workflow_call:
    # Map the workflow outputs to job outputs

jobs:
  isdraft:
    runs-on: ubuntu-latest
    # ONLY fail if this is a draft PR without the A5-run-CI label
    # Using negated condition: fail only if (is PR AND is draft AND no override label)
    if: ${{ !(github.event.pull_request.draft == true && !contains(github.event.pull_request.labels.*.name, 'A5-run-CI')) }}
    steps:
      - name: echo test
        shell: bash
        run: echo "CI allowed - not a draft PR or has override label"
