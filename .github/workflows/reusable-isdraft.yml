# The workflow is not part of reusable-preflight.yml to allow testing CI in draft.

name: Preflight isdraft

on:
  workflow_call:
    # Map the workflow outputs to job outputs

jobs:
  isdraft:
    runs-on: ubuntu-latest
    # Run for: non-draft PRs, PRs with A5-run-CI label, push events, or other non-PR events
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'A5-run-CI')
    steps:
      - name: echo test
        shell: bash
        run: echo "PR is not draft or this is not a PR event, starting CI"
