# cargo-deny configuration for Pezkuwi SDK
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
	{ triple = "x86_64-unknown-linux-gnu" },
	{ triple = "x86_64-unknown-linux-musl" },
	{ triple = "wasm32-unknown-unknown" },
]
# Exclude test/bench-only crates from checks
exclude = []

# Advisory database - check for known vulnerabilities
[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
	# Add specific advisory IDs to ignore here with justification:
	# "RUSTSEC-0000-0000", # reason for ignoring
]

# License compliance
[licenses]
unlicensed = "deny"
copyleft = "warn"
allow-osi-fsf-free = "either"
default = "deny"
confidence-threshold = 0.8
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"MIT",
	"MIT-0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unlicense",
	"CC0-1.0",
	"BSL-1.0",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Zlib",
	"MPL-2.0",
	"OpenSSL",
	"GPL-3.0-only WITH Classpath-exception-2.0",
	"GPL-3.0-or-later WITH Classpath-exception-2.0",
]
exceptions = [
	# ring uses a custom ISC-style license
	{ allow = ["OpenSSL"], name = "ring" },
]

[licenses.private]
ignore = true

# Banned crates and duplicate version detection
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
# Deny specific problematic crates
deny = []
skip = []
skip-tree = []

# Source origin checks
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
