[package]
name = "pezpallet-paged-list"
version = "0.6.0"
description = "FRAME pezpallet that provides a paged list data structure."
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/pezpallet-paged-list"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
docify = { workspace = true }
frame = { workspace = true, features = ["runtime"] }
pezsp-metadata-ir = { optional = true, workspace = true }
scale-info = { features = ["derive"], workspace = true }

[features]
default = ["std"]

std = ["codec/std", "frame/std", "pezsp-metadata-ir/std", "scale-info/std"]

runtime-benchmarks = ["frame/runtime-benchmarks"]

try-runtime = ["frame/try-runtime"]

frame-metadata = ["pezsp-metadata-ir"]
