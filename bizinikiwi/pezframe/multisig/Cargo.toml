[package]
name = "pezpallet-multisig"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME multi-signature dispatch pezpallet"
readme = "README.md"
documentation = "https://docs.rs/pezpallet-multisig"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
frame = { workspace = true, features = ["runtime"] }
scale-info = { features = ["derive"], workspace = true }

# third party
log = { workspace = true }

[dev-dependencies]
pezpallet-balances = { workspace = true, default-features = true }

[features]
default = ["std"]
std = ["codec/std", "frame/std", "log/std", "scale-info/std"]
runtime-benchmarks = [
  "frame/runtime-benchmarks",
  "pezpallet-balances/runtime-benchmarks",
]
try-runtime = ["frame/try-runtime", "pezpallet-balances/try-runtime"]
