[package]
name = "pezpallet-insecure-randomness-collective-flip"
version = "16.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Insecure do not use in production: FRAME randomness collective flip pezpallet"
readme = "README.md"
documentation.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
pezframe = { workspace = true, features = ["runtime"] }
pezframe-system = { workspace = true }
pezframe-support = { workspace = true }
safe-mix = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

[features]
default = ["std"]
std = ["codec/std", "pezframe/std", "safe-mix/std", "scale-info/std"]
try-runtime = ["pezframe/try-runtime"]
runtime-benchmarks = ["pezframe/runtime-benchmarks"]
