[package]
name = "pezpallet-statement"
version = "10.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME pallet for statement store"
documentation = "https://docs.rs/pezpallet-statement"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
pezframe-support = { workspace = true }
pezframe-system = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
pezsp-api = { workspace = true }
pezsp-core = { workspace = true }
pezsp-io = { workspace = true }
pezsp-runtime = { workspace = true }
pezsp-statement-store = { workspace = true }

[dev-dependencies]
pezpallet-balances = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "codec/std",
  "pezframe-support/std",
  "pezframe-system/std",
  "log/std",
  "pezpallet-balances/std",
  "scale-info/std",
  "pezsp-api/std",
  "pezsp-core/std",
  "pezsp-io/std",
  "pezsp-runtime/std",
  "pezsp-statement-store/std",
]
try-runtime = [
  "pezframe-support/try-runtime",
  "pezframe-system/try-runtime",
  "pezpallet-balances/try-runtime",
  "pezsp-runtime/try-runtime",
]
runtime-benchmarks = [
  "pezframe-support/runtime-benchmarks",
  "pezframe-system/runtime-benchmarks",
  "pezpallet-balances/runtime-benchmarks",
  "pezsp-api/runtime-benchmarks",
  "pezsp-io/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
  "pezsp-statement-store/runtime-benchmarks",
]
