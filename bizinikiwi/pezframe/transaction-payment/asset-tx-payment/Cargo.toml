[package]
name = "pezpallet-asset-tx-payment"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "pezpallet to manage transaction payments in assets"
readme = "README.md"
documentation = "https://docs.rs/pezpallet-asset-tx-payment"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Bizinikiwi dependencies
pezsp-io = { workspace = true }
pezsp-runtime = { workspace = true }

pezframe-benchmarking = { optional = true, workspace = true }
pezframe-support = { workspace = true }
pezframe-system = { workspace = true }
pezpallet-transaction-payment = { workspace = true }

# Other dependencies
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { optional = true, workspace = true, default-features = true }

[dev-dependencies]
pezpallet-assets = { workspace = true, default-features = true }
pezpallet-authorship = { workspace = true, default-features = true }
pezpallet-balances = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "codec/std",
  "pezframe-benchmarking?/std",
  "pezframe-support/std",
  "pezframe-system/std",
  "pezpallet-transaction-payment/std",
  "scale-info/std",
  "serde",
  "pezsp-io/std",
  "pezsp-runtime/std",
]
runtime-benchmarks = [
  "pezframe-benchmarking/runtime-benchmarks",
  "pezframe-support/runtime-benchmarks",
  "pezframe-system/runtime-benchmarks",
  "pezpallet-assets/runtime-benchmarks",
  "pezpallet-authorship/runtime-benchmarks",
  "pezpallet-balances/runtime-benchmarks",
  "pezpallet-transaction-payment/runtime-benchmarks",
  "pezsp-io/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
]
try-runtime = [
  "pezframe-support/try-runtime",
  "pezframe-system/try-runtime",
  "pezpallet-assets/try-runtime",
  "pezpallet-authorship/try-runtime",
  "pezpallet-balances/try-runtime",
  "pezpallet-transaction-payment/try-runtime",
  "pezsp-runtime/try-runtime",
]
