[package]
name = "pezpallet-example-offchain-worker"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "MIT-0"
homepage.workspace = true
repository.workspace = true
description = "FRAME example pezpallet for offchain worker"
readme = "README.md"
publish = false
documentation = "https://docs.rs/pezpallet-example-offchain-worker"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
pezframe-support = { workspace = true }
pezframe-system = { workspace = true }
lite-json = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
pezsp-core = { workspace = true }
pezsp-io = { workspace = true }
pezsp-keystore = { optional = true, workspace = true }
pezsp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
  "codec/std",
  "pezframe-support/std",
  "pezframe-system/std",
  "lite-json/std",
  "log/std",
  "scale-info/std",
  "pezsp-core/std",
  "pezsp-io/std",
  "pezsp-keystore/std",
  "pezsp-runtime/std",
]
try-runtime = [
  "pezframe-support/try-runtime",
  "pezframe-system/try-runtime",
  "pezsp-runtime/try-runtime",
]
runtime-benchmarks = [
  "pezframe-support/runtime-benchmarks",
  "pezframe-system/runtime-benchmarks",
  "pezsp-io/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
]
