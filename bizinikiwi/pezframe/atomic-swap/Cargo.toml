[package]
name = "pezpallet-atomic-swap"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME atomic swap pezpallet"
readme = "README.md"
documentation.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
pezframe = { workspace = true, features = ["runtime"] }
pezframe-system = { workspace = true }
pezframe-support = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

[dev-dependencies]
pezpallet-balances = { workspace = true, default-features = true }

[features]
default = ["std"]
std = ["codec/std", "pezframe/std", "pezpallet-balances/std", "scale-info/std"]
try-runtime = ["pezframe/try-runtime", "pezpallet-balances/try-runtime"]
runtime-benchmarks = [
	"pezframe/runtime-benchmarks",
	"pezpallet-balances/runtime-benchmarks",
]
