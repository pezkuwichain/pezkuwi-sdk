[package]
name = "cumulus-pallet-solo-to-para"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
description = "Adds functionality to migrate from a Solo to a Teyrchain"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-sudo = { workspace = true }
sp-runtime = { workspace = true }

# Pezkuwi
pezkuwi-primitives = { workspace = true }

# Cumulus
cumulus-pallet-teyrchain-system = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"cumulus-pallet-teyrchain-system/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-sudo/std",
	"pezkuwi-primitives/std",
	"scale-info/std",
	"sp-runtime/std",
]
try-runtime = [
	"cumulus-pallet-teyrchain-system/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-sudo/try-runtime",
	"sp-runtime/try-runtime",
]
runtime-benchmarks = [
	"cumulus-pallet-teyrchain-system/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pezkuwi-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
