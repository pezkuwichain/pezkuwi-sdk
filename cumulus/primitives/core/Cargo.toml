[package]
name = "cumulus-primitives-core"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Cumulus related core primitive types and traits"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
tracing = { workspace = true }

# Substrate
sp-api = { workspace = true }
sp-runtime = { workspace = true }
sp-trie = { workspace = true }

# Pezkuwi
pezkuwi-core-primitives = { workspace = true }
pezkuwi-primitives = { workspace = true }
pezkuwi-teyrchain-primitives = { workspace = true }
xcm = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"pezkuwi-core-primitives/std",
	"pezkuwi-primitives/std",
	"pezkuwi-teyrchain-primitives/std",
	"scale-info/std",
	"sp-api/std",
	"sp-runtime/std",
	"sp-trie/std",
	"tracing/std",
	"xcm/std",
]
runtime-benchmarks = [
	"pezkuwi-primitives/runtime-benchmarks",
	"pezkuwi-teyrchain-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
	"pezkuwi-core-primitives/runtime-benchmarks",
	"sp-api/runtime-benchmarks",
	"sp-trie/runtime-benchmarks"
]
