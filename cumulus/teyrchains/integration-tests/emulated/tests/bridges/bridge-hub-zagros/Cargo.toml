[package]
name = "bridge-hub-zagros-integration-tests"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Bridge Hub Zagros runtime integration tests with xcm-emulator"
publish = false

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
hex-literal = { workspace = true, default-features = true }
scale-info = { workspace = true }

# Substrate
frame-support = { workspace = true }
pallet-asset-conversion = { workspace = true }
pallet-assets = { workspace = true }
pallet-balances = { workspace = true }
pallet-message-queue = { workspace = true, default-features = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

# Pezkuwi
pallet-xcm = { workspace = true }
xcm = { workspace = true }
xcm-builder = { workspace = true }
xcm-executor = { workspace = true }

# Bridges
pallet-bridge-messages = { workspace = true }
pallet-bridge-relayers = { workspace = true }

# Cumulus
asset-hub-zagros-runtime = { workspace = true }
bp-asset-hub-zagros = { workspace = true }
bridge-hub-common = { workspace = true }
bridge-hub-zagros-runtime = { workspace = true }
cumulus-pallet-teyrchain-system = { workspace = true }
cumulus-pallet-xcmp-queue = { workspace = true }
emulated-integration-tests-common = { workspace = true }
pezkuwichain-zagros-system-emulated-network = { workspace = true }
testnet-teyrchains-constants = { features = [
	"pezkuwichain",
	"zagros",
], workspace = true, default-features = true }
teyrchains-common = { workspace = true, default-features = true }

# Snowbridge
snowbridge-core = { workspace = true }
snowbridge-inbound-queue-primitives = { workspace = true }
snowbridge-outbound-queue-primitives = { workspace = true }
snowbridge-pallet-inbound-queue = { workspace = true }
snowbridge-pallet-inbound-queue-fixtures = { workspace = true }
snowbridge-pallet-inbound-queue-v2 = { workspace = true }
snowbridge-pallet-outbound-queue = { workspace = true }
snowbridge-pallet-outbound-queue-v2 = { workspace = true }
snowbridge-pallet-system = { workspace = true }
snowbridge-pallet-system-v2 = { workspace = true }

[features]
runtime-benchmarks = [
	"asset-hub-zagros-runtime/runtime-benchmarks",
	"bp-asset-hub-zagros/runtime-benchmarks",
	"bridge-hub-common/runtime-benchmarks",
	"bridge-hub-zagros-runtime/runtime-benchmarks",
	"cumulus-pallet-teyrchain-system/runtime-benchmarks",
	"cumulus-pallet-xcmp-queue/runtime-benchmarks",
	"emulated-integration-tests-common/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"pallet-asset-conversion/runtime-benchmarks",
	"pallet-assets/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-bridge-messages/runtime-benchmarks",
	"pallet-bridge-relayers/runtime-benchmarks",
	"pallet-message-queue/runtime-benchmarks",
	"pallet-xcm/runtime-benchmarks",
	"pezkuwichain-zagros-system-emulated-network/runtime-benchmarks",
	"snowbridge-core/runtime-benchmarks",
	"snowbridge-inbound-queue-primitives/runtime-benchmarks",
	"snowbridge-outbound-queue-primitives/runtime-benchmarks",
	"snowbridge-pallet-inbound-queue-fixtures/runtime-benchmarks",
	"snowbridge-pallet-inbound-queue-v2/runtime-benchmarks",
	"snowbridge-pallet-inbound-queue/runtime-benchmarks",
	"snowbridge-pallet-outbound-queue-v2/runtime-benchmarks",
	"snowbridge-pallet-outbound-queue/runtime-benchmarks",
	"snowbridge-pallet-system-v2/runtime-benchmarks",
	"snowbridge-pallet-system/runtime-benchmarks",
	"sp-io/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"testnet-teyrchains-constants/runtime-benchmarks",
	"teyrchains-common/runtime-benchmarks",
	"xcm-builder/runtime-benchmarks",
	"xcm-executor/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
