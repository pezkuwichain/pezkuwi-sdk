[package]
name = "pallet-pez-rewards"
version = "1.0.0"
description = "PezkuwiChain Trust Score Based Rewards Distribution System"
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { default-features = false, features = [
	"derive",
], workspace = true }
serde = { version = "1.0", default-features = false, features = [
	"derive",
], optional = true }

frame-support = { default-features = false, workspace = true }
frame-system = { default-features = false, workspace = true }
log = { default-features = false, workspace = true }
sp-runtime = { default-features = false, workspace = true }
sp-std = { default-features = false, workspace = true }

# PezkuwiChain'in özel tiplerini ve trait'lerini içeren kütüphane
pezkuwi-primitives = { workspace = true, default-features = false }

# Standart Substrate paletleri
pallet-balances = { default-features = false, workspace = true }
pallet-nfts = { default-features = false, workspace = true }
pallet-scheduler = { default-features = false, workspace = true }

# PezkuwiChain özel paletleri
pallet-pez-treasury = { workspace = true, default-features = false }
pallet-trust = { workspace = true, default-features = false }

# Test ve Benchmark için Gerekli İsteğe Bağlı Bağımlılıklar
frame-benchmarking = { optional = true, workspace = true }
sp-core = { workspace = true, default-features = false, optional = true }
sp-io = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
# Test için gerekli olan bağımlılıklar
frame-system = { workspace = true, default-features = false, features = [
	"std",
] }
pallet-assets = { workspace = true, default-features = false, features = [
	"std",
] }
pallet-balances = { workspace = true, default-features = false, features = [
	"std",
] }
pallet-identity-kyc = { workspace = true, default-features = false, features = [
	"std",
] }
pallet-trust = { workspace = true, default-features = false, features = [
	"std",
] }
sp-core = { workspace = true, default-features = false, features = ["std"] }
sp-io = { workspace = true, default-features = false, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-assets/std",
	"pallet-balances/std",
	"pallet-identity-kyc/std",
	"pallet-nfts/std",
	"pallet-pez-treasury/std",
	"pallet-scheduler/std",
	"pallet-trust/std",
	"pezkuwi-primitives/std",
	"scale-info/std",
	"serde",
	"serde?/std",
	"sp-core?/std",
	"sp-io?/std",
	"sp-runtime/std",
	"sp-std/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-assets/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-identity-kyc/runtime-benchmarks",
	"pallet-nfts/runtime-benchmarks",
	"pallet-pez-treasury/runtime-benchmarks",
	"pallet-scheduler/runtime-benchmarks",
	"pallet-trust/runtime-benchmarks",
	"pezkuwi-primitives/runtime-benchmarks",
	"sp-core",
	"sp-io",
	"sp-io?/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-assets/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-identity-kyc/try-runtime",
	"pallet-nfts/try-runtime",
	"pallet-pez-treasury/try-runtime",
	"pallet-scheduler/try-runtime",
	"pallet-trust/try-runtime",
	"sp-runtime/try-runtime",
]
