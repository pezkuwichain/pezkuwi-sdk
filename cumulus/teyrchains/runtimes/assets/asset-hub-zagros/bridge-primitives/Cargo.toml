[package]
name = "bp-asset-hub-zagros"
description = "Primitives of AssetHubZagros teyrchain runtime."
version = "0.3.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate Dependencies
frame-support = { workspace = true }
sp-api = { workspace = true }
sp-core = { workspace = true }

# Bridge Dependencies
bp-bridge-hub-cumulus = { workspace = true }
bp-messages = { workspace = true }
bp-runtime = { workspace = true }
bp-xcm-bridge-hub-router = { workspace = true }
testnet-teyrchains-constants = { features = ["zagros"], workspace = true }

# Pezkuwi dependencies
xcm = { workspace = true }

[features]
default = ["std"]
std = [
	"bp-bridge-hub-cumulus/std",
	"bp-messages/std",
	"bp-runtime/std",
	"bp-xcm-bridge-hub-router/std",
	"codec/std",
	"frame-support/std",
	"scale-info/std",
	"sp-api/std",
	"sp-core/std",
	"testnet-teyrchains-constants/std",
	"xcm/std",
]
runtime-benchmarks = [
	"bp-bridge-hub-cumulus/runtime-benchmarks",
	"bp-messages/runtime-benchmarks",
	"bp-runtime/runtime-benchmarks",
	"bp-xcm-bridge-hub-router/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"xcm/runtime-benchmarks",
	"sp-api/runtime-benchmarks",
	"testnet-teyrchains-constants/runtime-benchmarks"
]
