[package]
name = "cumulus-pov-validator"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "A tool for validating PoVs locally"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codec = { workspace = true }
pezkuwi-node-primitives = { workspace = true }
pezkuwi-primitives = { workspace = true }
pezkuwi-teyrchain-primitives = { workspace = true }
sc-executor = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-maybe-compressed-blob = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
runtime-benchmarks = [
	"pezkuwi-primitives/runtime-benchmarks",
	"pezkuwi-teyrchain-primitives/runtime-benchmarks",
	"pezkuwi-node-primitives/runtime-benchmarks",
	"sc-executor/runtime-benchmarks"
]
