[package]
authors.workspace = true
name = "cumulus-relay-chain-minimal-node"
version = "0.7.0"
edition.workspace = true
description = "Minimal node implementation to be used in tandem with RPC or light-client mode."
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# pezkuwi deps
pezkuwi-core-primitives = { workspace = true, default-features = true }
pezkuwi-node-network-protocol = { workspace = true, default-features = true }
pezkuwi-node-subsystem-util = { workspace = true, default-features = true }
pezkuwi-overseer = { workspace = true, default-features = true }
pezkuwi-primitives = { workspace = true, default-features = true }

pezkuwi-network-bridge = { workspace = true, default-features = true }
pezkuwi-service = { workspace = true, default-features = true }

# substrate deps
prometheus-endpoint = { workspace = true, default-features = true }
sc-authority-discovery = { workspace = true, default-features = true }
sc-client-api = { workspace = true, default-features = true }
sc-network = { workspace = true, default-features = true }
sc-network-common = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = true }
sc-tracing = { workspace = true, default-features = true }
sc-utils = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-consensus-babe = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }

# cumulus deps
cumulus-client-bootnodes = { workspace = true, default-features = true }
cumulus-primitives-core = { workspace = true, default-features = true }
cumulus-relay-chain-interface = { workspace = true, default-features = true }
cumulus-relay-chain-rpc-interface = { workspace = true, default-features = true }

array-bytes = { workspace = true, default-features = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true, default-features = true }

[features]
runtime-benchmarks = [
	"cumulus-client-bootnodes/runtime-benchmarks",
	"cumulus-primitives-core/runtime-benchmarks",
	"cumulus-relay-chain-interface/runtime-benchmarks",
	"cumulus-relay-chain-rpc-interface/runtime-benchmarks",
	"pezkuwi-core-primitives/runtime-benchmarks",
	"pezkuwi-network-bridge/runtime-benchmarks",
	"pezkuwi-node-network-protocol/runtime-benchmarks",
	"pezkuwi-node-subsystem-util/runtime-benchmarks",
	"pezkuwi-overseer/runtime-benchmarks",
	"pezkuwi-primitives/runtime-benchmarks",
	"pezkuwi-service/runtime-benchmarks",
	"sc-authority-discovery/runtime-benchmarks",
	"sc-client-api/runtime-benchmarks",
	"sc-network-common/runtime-benchmarks",
	"sc-network/runtime-benchmarks",
	"sc-service/runtime-benchmarks",
	"sc-tracing/runtime-benchmarks",
	"sp-api/runtime-benchmarks",
	"sp-blockchain/runtime-benchmarks",
	"sp-consensus-babe/runtime-benchmarks",
	"sp-consensus/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
