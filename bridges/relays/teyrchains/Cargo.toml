[package]
name = "teyrchains-relay"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-std = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
relay-utils = { workspace = true }
tracing = { workspace = true }

# Bridge dependencies
bp-pezkuwi-core = { workspace = true, default-features = true }
relay-substrate-client = { workspace = true }

[dev-dependencies]
relay-substrate-client = { features = ["test-helpers"], workspace = true }
sp-core = { workspace = true, default-features = true }

[features]
runtime-benchmarks = [
	"bp-pezkuwi-core/runtime-benchmarks",
	"relay-substrate-client/runtime-benchmarks",
	"relay-utils/runtime-benchmarks"
]
