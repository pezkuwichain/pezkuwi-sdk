[package]
name = "substrate-relay-helper"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-std = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codec = { workspace = true, default-features = true }
futures = { workspace = true }
hex = { workspace = true, default-features = true }
num-traits = { workspace = true, default-features = true }
rbtag = { workspace = true }
strum = { features = ["derive"], workspace = true, default-features = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Bridge dependencies
bp-header-chain = { workspace = true, default-features = true }
bp-pezkuwi-core = { workspace = true, default-features = true }
bp-relayers = { workspace = true, default-features = true }
bp-teyrchains = { workspace = true, default-features = true }

equivocation-detector = { workspace = true }
finality-relay = { workspace = true }
messages-relay = { workspace = true }
relay-substrate-client = { workspace = true }
relay-utils = { workspace = true }
teyrchains-relay = { workspace = true }

pallet-bridge-grandpa = { workspace = true, default-features = true }
pallet-bridge-messages = { workspace = true, default-features = true }
pallet-bridge-teyrchains = { workspace = true, default-features = true }

bp-messages = { workspace = true, default-features = true }
bp-runtime = { workspace = true, default-features = true }

# Substrate Dependencies
frame-support = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
pallet-grandpa = { workspace = true, default-features = true }
sp-consensus-grandpa = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
sp-trie = { workspace = true }

[dev-dependencies]
relay-substrate-client = { features = ["test-helpers"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

[features]
runtime-benchmarks = [
	"bp-header-chain/runtime-benchmarks",
	"bp-messages/runtime-benchmarks",
	"bp-pezkuwi-core/runtime-benchmarks",
	"bp-relayers/runtime-benchmarks",
	"bp-runtime/runtime-benchmarks",
	"bp-teyrchains/runtime-benchmarks",
	"equivocation-detector/runtime-benchmarks",
	"finality-relay/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"messages-relay/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-bridge-grandpa/runtime-benchmarks",
	"pallet-bridge-messages/runtime-benchmarks",
	"pallet-bridge-teyrchains/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"relay-substrate-client/runtime-benchmarks",
	"relay-utils/runtime-benchmarks",
	"sp-consensus-grandpa/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"sp-trie/runtime-benchmarks",
	"teyrchains-relay/runtime-benchmarks"
]
