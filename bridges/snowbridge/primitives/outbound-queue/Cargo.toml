[package]
name = "snowbridge-outbound-queue-primitives"
description = "Snowbridge Outbound Queue Primitives"
version = "0.2.0"
authors = ["Snowfork <contact@snowfork.com>"]
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
documentation = "https://docs.rs/snowbridge-outbound-queue-primitives"
homepage = { workspace = true }

[lints]
workspace = true

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[dependencies]
codec = { workspace = true }
hex-literal = { workspace = true, default-features = true }
scale-info = { features = ["derive"], workspace = true }
tracing = { workspace = true }

pezkuwi-teyrchain-primitives = { workspace = true }
xcm = { workspace = true }
xcm-builder = { workspace = true }
xcm-executor = { workspace = true }

pezframe-support = { workspace = true }
pezframe-system = { workspace = true }
pezsp-arithmetic = { workspace = true }
pezsp-core = { workspace = true }
pezsp-io = { workspace = true }
pezsp-runtime = { workspace = true }
pezsp-std = { workspace = true }

alloy-core = { workspace = true, features = ["sol-types"] }
ethabi = { workspace = true }

snowbridge-core = { workspace = true }
snowbridge-verification-primitives = { workspace = true }

[features]
default = ["std"]
std = [
  "alloy-core/std",
  "codec/std",
  "ethabi/std",
  "pezframe-support/std",
  "pezframe-system/std",
  "pezkuwi-teyrchain-primitives/std",
  "scale-info/std",
  "snowbridge-core/std",
  "snowbridge-verification-primitives/std",
  "pezsp-arithmetic/std",
  "pezsp-core/std",
  "pezsp-io/std",
  "pezsp-runtime/std",
  "pezsp-std/std",
  "tracing/std",
  "xcm-builder/std",
  "xcm-executor/std",
  "xcm/std",
]
runtime-benchmarks = [
  "pezframe-support/runtime-benchmarks",
  "pezframe-system/runtime-benchmarks",
  "pezkuwi-teyrchain-primitives/runtime-benchmarks",
  "snowbridge-core/runtime-benchmarks",
  "snowbridge-verification-primitives/runtime-benchmarks",
  "pezsp-io/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
  "xcm-builder/runtime-benchmarks",
  "xcm-executor/runtime-benchmarks",
  "xcm/runtime-benchmarks",
]
