[package]
name = "snowbridge-pezpallet-inbound-queue-v2"
description = "Snowbridge Inbound Queue Pallet V2"
version = "0.2.0"
authors = ["Snowfork <contact@snowfork.com>"]
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
documentation = "https://docs.rs/snowbridge-pezpallet-inbound-queue-v2"
homepage = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[dependencies]
alloy-core = { workspace = true, features = ["sol-types"] }
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { optional = true, workspace = true, default-features = true }
tracing = { workspace = true }

pezframe-benchmarking = { optional = true, workspace = true }
pezframe-support = { workspace = true }
pezframe-system = { workspace = true }
pezpallet-balances = { workspace = true }
pezsp-core = { workspace = true }
pezsp-io = { workspace = true }
pezsp-runtime = { workspace = true }
pezsp-std = { workspace = true }

xcm = { workspace = true }
xcm-builder = { workspace = true }
xcm-executor = { workspace = true }

snowbridge-beacon-primitives = { workspace = true }
snowbridge-core = { workspace = true }
snowbridge-inbound-queue-primitives = { workspace = true }
snowbridge-pezpallet-inbound-queue-v2-fixtures = { optional = true, workspace = true }

bp-relayers = { workspace = true }

[dev-dependencies]
pezframe-benchmarking = { workspace = true, default-features = true }
hex-literal = { workspace = true, default-features = true }
snowbridge-test-utils = { workspace = true }
pezsp-keyring = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "alloy-core/std",
  "bp-relayers/std",
  "codec/std",
  "pezframe-benchmarking/std",
  "pezframe-support/std",
  "pezframe-system/std",
  "pezpallet-balances/std",
  "scale-info/std",
  "serde",
  "snowbridge-beacon-primitives/std",
  "snowbridge-core/std",
  "snowbridge-inbound-queue-primitives/std",
  "snowbridge-pezpallet-inbound-queue-v2-fixtures?/std",
  "pezsp-core/std",
  "pezsp-io/std",
  "pezsp-runtime/std",
  "pezsp-std/std",
  "tracing/std",
  "xcm-builder/std",
  "xcm-executor/std",
  "xcm/std",
]
runtime-benchmarks = [
  "bp-relayers/runtime-benchmarks",
  "pezframe-benchmarking",
  "pezframe-benchmarking/runtime-benchmarks",
  "pezframe-support/runtime-benchmarks",
  "pezframe-system/runtime-benchmarks",
  "pezpallet-balances/runtime-benchmarks",
  "snowbridge-beacon-primitives/runtime-benchmarks",
  "snowbridge-core/runtime-benchmarks",
  "snowbridge-inbound-queue-primitives/runtime-benchmarks",
  "snowbridge-pezpallet-inbound-queue-v2-fixtures/runtime-benchmarks",
  "snowbridge-test-utils/runtime-benchmarks",
  "pezsp-io/runtime-benchmarks",
  "pezsp-keyring/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
  "xcm-builder/runtime-benchmarks",
  "xcm-executor/runtime-benchmarks",
  "xcm/runtime-benchmarks",
]
try-runtime = [
  "pezframe-support/try-runtime",
  "pezframe-system/try-runtime",
  "pezpallet-balances/try-runtime",
  "snowbridge-inbound-queue-primitives/try-runtime",
  "pezsp-runtime/try-runtime",
]
