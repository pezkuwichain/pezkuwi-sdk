[package]
name = "snowbridge-outbound-queue-runtime-api"
description = "Snowbridge Outbound Queue Runtime API"
version = "0.2.0"
authors = ["Snowfork <contact@snowfork.com>"]
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
documentation = "https://docs.rs/snowbridge-outbound-queue-runtime-api"
homepage = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[dependencies]
codec = { features = ["derive"], workspace = true }
pezframe-support = { workspace = true }
snowbridge-core = { workspace = true }
snowbridge-merkle-tree = { workspace = true }
snowbridge-outbound-queue-primitives = { workspace = true }
pezsp-api = { workspace = true }
pezsp-std = { workspace = true }

[features]
default = ["std"]
std = [
  "codec/std",
  "pezframe-support/std",
  "snowbridge-core/std",
  "snowbridge-merkle-tree/std",
  "snowbridge-outbound-queue-primitives/std",
  "pezsp-api/std",
  "pezsp-std/std",
]
runtime-benchmarks = [
  "pezframe-support/runtime-benchmarks",
  "snowbridge-core/runtime-benchmarks",
  "snowbridge-merkle-tree/runtime-benchmarks",
  "snowbridge-outbound-queue-primitives/runtime-benchmarks",
  "pezsp-api/runtime-benchmarks",
]
