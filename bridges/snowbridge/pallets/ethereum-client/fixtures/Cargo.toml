[package]
name = "snowbridge-pezpallet-ethereum-client-fixtures"
description = "Snowbridge Ethereum Client Test Fixtures"
version = "0.9.0"
authors = ["Snowfork <contact@snowfork.com>"]
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
documentation = "https://docs.rs/snowbridge-pezpallet-ethereum-client-fixtures"
homepage = { workspace = true }
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[dependencies]
hex-literal = { workspace = true, default-features = true }
snowbridge-beacon-primitives = { workspace = true }
snowbridge-verification-primitives = { workspace = true }
pezsp-core = { workspace = true }
pezsp-std = { workspace = true }

[features]
default = ["std"]
std = [
  "snowbridge-beacon-primitives/std",
  "snowbridge-verification-primitives/std",
  "pezsp-core/std",
  "pezsp-std/std",
]
runtime-benchmarks = [
  "snowbridge-beacon-primitives/runtime-benchmarks",
  "snowbridge-verification-primitives/runtime-benchmarks",
]
