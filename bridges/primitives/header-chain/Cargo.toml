[package]
name = "bp-header-chain"
description = "A common interface for describing what a bridge pallet should be able to do."
version = "0.7.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository.workspace = true
documentation = "https://docs.rs/bp-header-chain"
homepage = { workspace = true }

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
finality-grandpa = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], workspace = true }

# Bridge dependencies
bp-runtime = { workspace = true }

# Bizinikiwi Dependencies
pezframe-support = { workspace = true }
pezsp-consensus-grandpa = { features = ["serde"], workspace = true }
pezsp-core = { features = ["serde"], workspace = true }
pezsp-runtime = { features = ["serde"], workspace = true }
pezsp-std = { workspace = true }

[dev-dependencies]
bp-test-utils = { workspace = true, default-features = true }
hex = { workspace = true, default-features = true }
hex-literal = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "bp-runtime/std",
  "codec/std",
  "finality-grandpa/std",
  "pezframe-support/std",
  "scale-info/std",
  "serde/std",
  "pezsp-consensus-grandpa/std",
  "pezsp-core/std",
  "pezsp-runtime/std",
  "pezsp-std/std",
]
runtime-benchmarks = [
  "bp-runtime/runtime-benchmarks",
  "bp-test-utils/runtime-benchmarks",
  "pezframe-support/runtime-benchmarks",
  "pezsp-consensus-grandpa/runtime-benchmarks",
  "pezsp-runtime/runtime-benchmarks",
]
